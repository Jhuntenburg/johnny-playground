<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Johnny's Playground</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    a {
      text-decoration: none;
      text-align: center;
    }
    .smiley {
      font-size: 150px;
      display: block;
      transition: transform 0.2s;
    }
    .smiley:hover {
      transform: scale(1.2);
    }
    .label {
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      display: block;
    }
  </style>
</head>
<body>
  <a href="art.html">
    <span class="smiley">😊</span>
    <span class="label">Start Drawing!</span>
  </a>
</body>
</html>
